name: finora-production
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    image: finora-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
      args:
        EXPO_PUBLIC_API_URL: https://${FINORA_DOMAIN:?set FINORA_DOMAIN}
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ['pnpm', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  api:
    image: finora-api:local
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      LOCAL_STORAGE_PATH: /data/uploads
    volumes:
      - document_data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: finora-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        EXPO_PUBLIC_API_URL: https://${FINORA_DOMAIN:?set FINORA_DOMAIN}
    restart: unless-stopped
    environment:
      FINORA_DOMAIN: ${FINORA_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  document_data:
  caddy_data:
  caddy_config:
