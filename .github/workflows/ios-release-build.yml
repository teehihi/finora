name: FINORA iOS Release build

on:
  pull_request:
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'scripts/verify-cyl-prebuild.mjs'
      - '.github/workflows/ios-release-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finora-ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-compile:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prebuild and install pods
        run: |
          xcodebuild -version
          pnpm --filter @finora/app exec expo prebuild --platform ios --no-install
          node scripts/verify-cyl-prebuild.mjs
          cd apps/app/ios
          pod install
          grep -q 'FinoraCYLDockModule.self' 'Pods/Target Support Files/Pods-Finora/ExpoModulesProvider.swift'
      - name: Compile unsigned iOS Release
        id: compile
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/finora-ios-diagnostics"
          mkdir -p "$diagnostics"
          xcodebuild -hideShellScriptEnvironment -workspace apps/app/ios/Finora.xcworkspace -scheme Finora \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/finora-ios-build" -resultBundlePath "$diagnostics/Finora.xcresult" \
            CODE_SIGNING_ALLOWED=NO build > "$diagnostics/xcodebuild.log" 2>&1 || {
              status=$?
              awk '/[Ee]rror:|fatal error|Undefined symbols|Command .* failed/ && ++errors <= 60 {print "  " $0}' "$diagnostics/xcodebuild.log"
              tail -n 30 "$diagnostics/xcodebuild.log" | sed 's/^/  /'
              exit "$status"
            }
      - name: Upload failed Xcode build diagnostics
        if: failure() && steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-release-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finora-ios-diagnostics/
          retention-days: 7
          if-no-files-found: error
